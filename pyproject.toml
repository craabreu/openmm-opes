[project]
name = "openmm-opes"
version = "0.1.0"
description = "OpenMM implementation of On-the-fly Probability Enhanced Sampling (OPES)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charlles Abreu" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "openmm>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.16", "ty==0.0.72"]
# mkdocs >= 1.6 is required for the exclude_docs setting used by mkdocs.yml
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end simulations that take minutes"]

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Deliberately no "N" rules: the public API is camelCase to match OpenMM.
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ty.analysis]
# OpenMM ships no type stubs, and the lint CI job installs it without conda.
# online_kde is the ORIGINAL implementation, sys.path-shimmed at runtime from
# a sibling repo (tests/data/make_reference.py) rather than installed, so it
# is never resolvable statically.
allowed-unresolved-imports = ["openmm", "openmm.**", "online_kde"]

[[tool.ty.overrides]]
# numpy-stubs gap, confirmed a false positive: np.logaddexp.reduce(array) is
# ordinary numpy usage that runs correctly (see the passing test suite), but
# the stub's reduce() overloads for binary ufuncs cannot be satisfied without
# an explicit out= argument, so ty reports every plain reduce() call here as
# having no matching overload.
include = ["src/openmm_opes/kde.py", "tests/test_kde.py"]

[tool.ty.overrides.rules]
no-matching-overload = "ignore"

[[tool.ty.overrides]]
# numpy-stubs gap, confirmed a false positive: np.savez(path, **arrays) passes
# arbitrary ndarrays through **kwds, but the stub resolves that against
# allow_pickle: bool instead of **kwds: ArrayLike, reporting every array
# argument as "expected bool". Same class of gap sieve's own pyproject.toml
# documents for the identical call shape.
include = ["tests/data/make_reference.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
# openmm.unit stub gap, confirmed a false positive: unit.kelvin and
# unit.kilojoules_per_mole resolve fine, but unit.picosecond/picoseconds do
# not, even though `dir(unit)` and runtime multiplication both confirm they
# exist -- these unit constants are evidently built at import time in a way
# ty's static analysis can't trace, unlike the ones assigned as literal
# module-level names.
include = ["tests/test_opes.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
