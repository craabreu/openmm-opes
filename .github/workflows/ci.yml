name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately does NOT install openmm: it ships no type stubs, so
      # installing it would buy ty nothing here (see allowed-unresolved-imports
      # below). ruff needs nothing installed, and ty needs numpy, scipy and
      # pytest resolvable (all real, first-party-typed dependencies).
      - run: pip install ruff ty numpy scipy pytest
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: ty check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # OpenMM publishes official wheels to PyPI (openmm/openmm-wheels) with
      # full coverage across manylinux, macOS (x86_64 + arm64) and Windows,
      # so no conda/mamba setup is needed to install it.
      - run: pip install -e ".[dev]"
      - run: pytest -v

  docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mkdocstrings reads the source statically via griffe, so the docs build
      # needs neither openmm nor an importable package at runtime.
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: pip install --no-deps -e .
      - run: mkdocs gh-deploy --force
