name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately does NOT install the package: openmm's canonical channel
      # is conda-forge. ruff needs nothing installed, and ty needs numpy,
      # scipy and pytest resolvable (all pure-Python-installable), with
      # openmm covered by allowed-unresolved-imports.
      - run: pip install ruff ty numpy scipy pytest
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: ty check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      # OpenMM's canonical distribution channel is conda-forge, not PyPI.
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          cache-environment: true
      - run: pip install --no-deps -e .
      - run: pytest -v

  docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mkdocstrings reads the source statically via griffe, so the docs build
      # needs neither openmm nor an importable package at runtime.
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: pip install --no-deps -e .
      - run: mkdocs gh-deploy --force
